<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Infisical banner</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1252px; height: 652px; overflow: hidden; background: #0b0c0e; }
  .banner { position: relative; width: 1252px; height: 652px; overflow: hidden; background: #0b0c0e; isolation: isolate; }
  .glow { position: absolute; z-index: -2; background-size: cover; background-position: center; }
  .glow-main {
    left: 50%; bottom: -330px; width: 1500px; height: 760px; transform: translateX(-50%) rotate(180deg);
    background-image: url(glow-teal.webp);
    opacity: 0.8;
    filter: saturate(1.35) brightness(1.05);
    -webkit-mask-image: radial-gradient(closest-side, #000 25%, transparent 100%);
    mask-image: radial-gradient(closest-side, #000 25%, transparent 100%);
  }
  .glow-top {
    left: 50%; top: -300px; width: 1100px; height: 520px; transform: translateX(-50%);
    background-image: url(glow.webp);
    opacity: 0.16;
    -webkit-mask-image: radial-gradient(closest-side, #000 10%, transparent 100%);
    mask-image: radial-gradient(closest-side, #000 10%, transparent 100%);
  }
  .grain { position: absolute; inset: 0; z-index: 3; opacity: 0.14; mix-blend-mode: overlay; pointer-events: none; }
  .window {
    position: absolute; border-radius: 14px; overflow: hidden;
    background: #16171a; border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 6px rgba(255,255,255,0.025);
  }
  .bar { height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 13px; background: #1c1d21; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3b40; }
  .window img { display: block; width: 100%; }
  .shade { position: absolute; inset: 28px 0 0; }
  .secrets { left: -170px; top: 150px; width: 500px; transform: rotate(-9deg); }
  .secrets .shade { background: linear-gradient(90deg, rgba(11,12,14,0.75), rgba(11,12,14,0.3) 75%, rgba(11,12,14,0.4)); }
  .agent { left: 140px; top: 438px; width: 420px; transform: rotate(-4deg); }
  .agent .shade { background: linear-gradient(180deg, rgba(11,12,14,0.3), rgba(11,12,14,0.8) 70%); }
  .replay { right: -190px; top: 110px; width: 520px; transform: rotate(8deg); }
  .replay .shade { background: linear-gradient(270deg, rgba(11,12,14,0.75), rgba(11,12,14,0.3) 75%, rgba(11,12,14,0.4)); }
  .pam { right: 130px; top: 450px; width: 420px; transform: rotate(3deg); }
  .pam .shade { background: linear-gradient(180deg, rgba(11,12,14,0.3), rgba(11,12,14,0.8) 70%); }
  .fade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 30% 26% at 50% 45%, rgba(11,12,14,0.7), transparent 100%),
      linear-gradient(180deg, rgba(11,12,14,0.6) 0%, transparent 25%, transparent 72%, rgba(11,12,14,0.7) 100%);
  }
  .lockup { position: absolute; z-index: 2; left: 50%; top: 45%; transform: translate(-50%, -50%); }
  .logo { width: 380px; aspect-ratio: 257 / 41; background: #fff; -webkit-mask: url(logo.svg) center / contain no-repeat; mask: url(logo.svg) center / contain no-repeat; }
</style>
</head>
<body>
<div class="banner">
  <div class="glow glow-top"></div>
  <div class="glow glow-main"></div>
  <div class="window secrets"><div class="bar"><i></i><i></i><i></i></div><img src="secrets.webp" alt=""><div class="shade"></div></div>
  <div class="window replay"><div class="bar"><i></i><i></i><i></i></div><img src="session-replay.webp" alt=""><div class="shade"></div></div>
  <div class="window agent"><div class="bar"><i></i><i></i><i></i></div><img src="agent-vault.webp" alt=""><div class="shade"></div></div>
  <div class="window pam"><div class="bar"><i></i><i></i><i></i></div><img src="pam.webp" alt=""><div class="shade"></div></div>
  <div class="fade"></div>
  <div class="lockup"><div class="logo" role="img" aria-label="Infisical"></div></div>
  <svg class="grain" width="1252" height="652"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
</body>
</html>
